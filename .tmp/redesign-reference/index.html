function cover(txt,cls=''){return `<span class="cover ${cls}" style="--art:${txt}">${(cls?'':'')}</span>`}
function song(row,i,large=false){return `<div class="songline"><span class="cover ${large?'lg':''}" style="--art:${art[i%art.length]}">${row[0].split(' ')[0]}</span><div><b>${row[0]}</b><div class="artist">${row[1]}</div></div></div>`}
function nav(active){document.getElementById('navlinks').innerHTML=pages.map(p=>`<a href="#${p[0]}" class="${active===p[0]?'active':''}">${p[1]}</a>`).join('')}
function hero(kicker,title,lede,visual){return `<section class="hero"><div><div class="eyebrow">${kicker}</div><h1 class="page-title ${title.length>18?'small':''}">${title}</h1><p class="lede">${lede}</p><div class="hero-actions"><button class="btn primary">Explore current charts</button><button class="btn">Share</button><button class="btn gold">September 2026</button></div></div>${visual}</section>`}
function visual(num,caption,idx=0){return `<div class="hero-visual"><div><div class="metric-label" style="color:#f8d978">Featured</div><div class="hero-number">${num}</div></div><p>${caption}</p><span class="hero-art" style="background:${art[idx]}"></span></div>`}
function charts(){return `<div class="page">${hero('Kenya','Ngoma Top 50','A stronger landing chart structure: hero leader, quick context, platform filters, then a cleaner ranking table with calmer spacing and heavier hierarchy.',visual('#1','Finale leads this month while movement, platforms, peak and points stay visible without making the table feel crowded.',2))}
<section class="surface"><div class="toolbar"><div class="toolbar-left"><select class="select"><option>September 2026</option></select><span class="tab active">Singles</span><span class="tab">Albums</span><span class="tab">Artists</span><span class="tab">Songwriters</span><span class="tab">Producers</span></div><div class="toolbar-right"><span class="platform-chip apple">Apple Music</span><span class="platform-chip audio">Audiomack</span><span class="platform-chip boom">Boomplay</span><span class="platform-chip shazam">Shazam</span><span class="platform-chip spotify">Spotify</span><span class="platform-chip youtube">YouTube</span></div></div><div class="chart-lead"><div class="leader-card">${song(monthly[2],2,true)}<div><h2>Finale</h2><p class="muted" style="color:rgba(255,255,255,.68)">Bien & Alikiba · Kenya / Tanzania</p><div class="leader-meta"><div><span class="tiny">Rank</span><b>#1</b></div><div><span class="tiny">Peak</span><b>#1</b></div><div><span class="tiny">Months</span><b>6</b></div></div></div></div><div class="side-stack">${monthly.slice(0,5).filter((_,i)=>i!==2).slice(0,4).map((r,i)=>`<div class="mini-rank"><span class="rank-badge">${i+2}</span>${song(r,i)}<div class="points">${r[4]*10+r[0].length}</div></div>`).join('')}</div></div></section>
<section class="surface flush"><div class="chart-shell"><table class="table"><thead><tr><th>#</th><th>Song</th><th>Move</th><th>Months</th><th>Last</th><th>Peak</th><th>Details</th></tr></thead><tbody>${monthly.concat(allTime.slice(0,30)).slice(0,50).map((r,i)=>{let mv=r[3]||'—';let cls=mv==='NEW'?'new':mv[0]==='+'?'up':mv[0]==='-'?'down':'';return `<tr class="${i===0?'first-row':''}"><td>${i+1}</td><td>${song(r,i)}</td><td><span class="change ${cls}">${mv}</span></td><td class="num">${r[4]||r[3]}</td><td>${r[5]||'—'}</td><td>${r[5]?Math.max(1,Math.min(9,r[5]-1)):'#'+(i+1)}</td><td><span class="more">+</span></td></tr>`}).join('')}</tbody></table></div></section></div>`}
function analytics(){return `<div class="page">${hero('Singles analytics','Monthly intelligence','A more editorial analytics page: one visual story at a time, side-by-side climbers and drops, then records and Hall of Fame in structured sections.',visual('179','Total charted songs tracked across all published monthly Top 50 charts.',9))}
<section class="masonry"><div><div class="feature-art" style="--art:${art[9]}"><strong>Gratitude</strong></div><div class="list-card"><h3>Biggest drops</h3>${monthly.slice(12,18).map((r,i)=>`<div class="row">${song(r,i+3)}<span class="change down" style="margin-left:auto">▼ ${[36,27,20,16,11,9][i]}</span></div>`).join('')}</div></div><div><div class="list-card"><h3>Biggest climbers</h3>${monthly.filter(r=>String(r[3]).startsWith('+')).slice(0,5).map((r,i)=>`<div class="row">${song(r,i)}<span class="change up" style="margin-left:auto">▲ ${r[3].replace('+','')}</span></div>`).join('')}</div><div class="feature-art" style="--art:${art[8]};height:310px"><strong>Panic</strong></div><div class="list-card"><h3>New entries</h3>${monthly.filter(r=>r[3]==='NEW').concat([['Malakia','Mbosso','NEW'],['BLOW','Sparkers','NEW'],['Upweke','Jay Melody','NEW']]).map((r,i)=>`<div class="row">${song(r,i+6)}<span class="change new" style="margin-left:auto">NEW</span></div>`).join('')}</div></div></section>
<section class="surface"><div class="section-head"><h2>Top countries</h2><span class="section-note">Table and graph views can use the same content block.</span></div><div class="bar-chart">${[['KE',16,'#d91c30'],['TZ',14,'#247eea'],['NG',6,'#1eb954'],['JM',4,'#e4ba00'],['ZA',4,'#112faf']].map(x=>`<div class="bar"><span>${x[0]}</span><div class="bar-track"><div class="bar-fill" style="--w:${x[1]*6.2}%;--c:${x[2]}"></div></div><b>${x[1]}</b></div>`).join('')}</div></section>
<section class="surface"><div class="section-head"><h2>Records & milestones</h2></div><div class="record-table"><div class="r"><div>Record</div><div>Leader</div><div>Detail</div></div>${[['Most months at #1','Finale','No. 1 for 5 months across all tracked months'],['Highest points score','Pawa','Mbosso · 511 points'],['Chart longevity','Backbencher','Charted all 13 months'],['Total charted songs','179','All tracked months']].map(r=>`<div class="r"><div><b>${r[0]}</b></div><div>${r[1]}</div><div class="muted">${r[2]}</div></div>`).join('')}</div></section></div>`}
function head(){return `<div class="page">${hero('Compare two releases','Head-to-Head','A clearer comparison structure: selected releases first, exact outcome second, then trajectory and platform details after context is established.',visual('VS','Backbencher has the stronger all-time score; Inama leads on selected individual platforms.',11))}
<section class="surface"><div class="section-head"><h2>Song head-to-head</h2><div class="tabs"><span class="tab active">Singles</span><span class="tab">Albums</span><span class="tab">Artists</span></div></div><div class="compare-hero"><div class="compare-card" style="--side:var(--gold)">${song(['Backbencher','Toxic Lyrikali & Countree Hype'],11,true)}<h2>Backbencher</h2><p class="small">Stronger lifetime total and platform spread.</p><div class="stats"><div><div class="metric-big">427</div><span class="tiny">Total pts</span></div><div><div class="metric-big">#4</div><span class="tiny">Peak</span></div></div></div><div class="vs">VS</div><div class="compare-card" style="--side:var(--blue)">${song(['Inama','Zuchu & Diamond Platnumz'],9,true)}<h2>Inama</h2><p class="small">Lower total, but excellent Boomplay and YouTube strength.</p><div class="stats"><div><div class="metric-big">263</div><span class="tiny">Total pts</span></div><div><div class="metric-big">#6</div><span class="tiny">Peak</span></div></div></div></div></section>
<section class="surface"><div class="section-head"><h2>Rank trajectory</h2><span class="section-note">Lower rank is better.</span></div><div class="trajectory"><svg viewBox="0 0 900 230" preserveAspectRatio="none"><polyline points="20,30 100,30 180,34 260,44 340,54 420,82 500,118 580,98 660,52 740,66 820,64 880,96" fill="none" stroke="#bf870e" stroke-width="5"/><polyline points="20,128 100,40 180,84 260,110 340,82 420,78 500,100 580,130 660,178 740,180 820,179 880,168" fill="none" stroke="#1677d8" stroke-width="5"/><g fill="#fff" stroke-width="4"><circle cx="100" cy="30" r="8" stroke="#bf870e"/><circle cx="660" cy="178" r="8" stroke="#1677d8"/></g></svg></div></section>
<section class="surface"><div class="section-head"><h2>Metric matrix</h2></div><div class="matrix">${[['427','Total points','263'],['#4','Peak','#6'],['#18','Avg. rank','#31'],['13/13','Months','13/13'],['6/6','Platforms charted','4/6'],['45','Appearances','31'],['#10','Apple Music','—'],['#3','Audiomack','#4'],['#4','Boomplay','#1'],['#29','Shazam','#19'],['#4','Spotify','—'],['#11','YouTube','#3']].map(r=>r.map(c=>`<div>${c}</div>`).join('')).join('')}</div></section></div>`}
function alltime(){return `<div class="page">${hero('All time','Legacy leaderboard','A lifetime page should feel more prestigious: podium first, filter context second, then a focused all-time ranking with readable rows.',visual('511','Pawa is the current combined all-time leader across the September 2025 – September 2026 dataset.',10))}
<section class="surface"><div class="section-head"><h2>Lifetime podium</h2><div class="tabs"><span class="tab active">Combined</span><span class="tab">Singles</span><span class="tab">Albums</span></div></div><div class="podium"><div class="pod"><span class="rank-badge">#2</span>${song(allTime[1],1,true)}<b>447 pts</b></div><div class="pod"><span class="rank-badge">#1</span>${song(allTime[0],10,true)}<b>511 pts</b></div><div class="pod"><span class="rank-badge">#3</span>${song(allTime[2],2,true)}<b>443 pts</b></div></div></section>
<section class="surface flush"><div class="chart-shell"><table class="table"><thead><tr><th>#</th><th>Title</th><th>Total pts</th><th>Months</th></tr></thead><tbody>${allTime.map((r,i)=>`<tr class="${i===0?'first-row':''}"><td>${i+1}</td><td>${song(r,i)}</td><td class="num">${r[2]}</td><td class="num">${r[3]}</td></tr>`).join('')}</tbody></table></div></section></div>`}
function certs(){return `<div class="page">${hero('Point-based awards','Certifications','Awards need to feel collectible and easy to scan. This structure highlights the leader, explains the system, then groups certified songs by tier.',visual('28','Certified songs currently across Wave and Pulse levels.',5))}
<section class="grid"><div class="span-5 surface"><div class="section-head"><h2>Current leader</h2></div>${song(allTime[0],10,true)}<div class="grid" style="margin-top:22px"><div class="span-6 card"><span class="tiny">Award</span><div class="metric-big">Wave</div></div><div class="span-6 card"><span class="tiny">Points</span><div class="metric-big">511</div></div></div></div><div class="span-7 surface"><div class="section-head"><h2>How awards work</h2></div><div class="process" style="grid-template-columns:1fr"><div class="step"><div><b>Only combined song points count</b><p class="small">A release keeps adding points as long as it appears in the Combined Top 50.</p></div></div><div class="step"><div><b>Show the highest earned tier</b><p class="small">Each song appears once, in the highest award level it has reached.</p></div></div><div class="step"><div><b>Lifetime points do not reset monthly</b><p class="small">Certifications create long-term memory beyond a single chart cycle.</p></div></div></div></div></section>
<section class="surface"><div class="section-head"><h2>Award levels</h2></div><div class="award-strip"><div class="award" style="--award:#b98308"><div><span class="coin">L</span><h3>Legacy</h3><p class="small">600+ lifetime points</p></div><b>0 current</b></div><div class="award" style="--award:#73afd7"><div><span class="coin" style="background:radial-gradient(circle,#ddf4ff,#2d6388);color:#fff">W</span><h3>Wave</h3><p class="small">400+ lifetime points</p></div><b>6 current</b></div><div class="award" style="--award:#cc6b15"><div><span class="coin" style="background:radial-gradient(circle,#ffd08c,#8b3907)">P</span><h3>Pulse</h3><p class="small">200+ lifetime points</p></div><b>22 current</b></div></div></section>
<section class="surface"><div class="section-head"><h2>Certified songs</h2><span class="section-note">Grouped cards reduce the long-list fatigue.</span></div><div class="cert-grid">${allTime.slice(0,28).map((r,i)=>`<div class="cert" style="--award:${i<6?'#73afd7':'#cc6b15'}"><span class="coin" style="width:34px;height:34px;font-size:12px;background:${i<6?'radial-gradient(circle,#ddf4ff,#2d6388)':'radial-gradient(circle,#ffd08c,#8b3907)'};color:${i<6?'#fff':'#15110a'}">${i<6?'W':'P'}</span>${song(r,i).replace('songline','songline stacked').replace('cover ','cover ')}<div class="metric-big">${r[2]}</div></div>`).join('')}</div></section></div>`}
function about(){return `<div class="page">${hero('About Ngoma Charts','Transparent music rankings','Keep the trust-building copy, but make the page feel like a clear product story: what it tracks, how it scores, and what outputs the data powers.',visual('10','Methodology steps from monthly source charts to public rankings, analytics, certifications and Hall of Fame.',0))}
<section class="surface"><div class="section-head"><h2>How it works</h2><span class="section-note">The formula stays simple and visible.</span></div><div class="formula"><span>Higher rank = more points</span><span>Combined points decide the Top 50</span></div><div class="process">${['Start with monthly source charts','Separate singles, albums, and artists','Clean names so the same release counts once','Turn each platform rank into points','Add platform points together','Publish the Combined Top 50','Compare with previous months','Build artist rankings from credited work','Create analytics, records, and Hall of Fame entries','Update certifications from lifetime points'].map(t=>`<div class="step"><div><b>${t}</b><p class="small">Shorter copy, stronger spacing, and repeated hierarchy make the methodology easier to read.</p></div></div>`).join('')}</div></section>
<section class="grid"><div class="span-4 info-block"><h3>Platforms tracked</h3><div class="tabs"><span class="platform-chip apple">Apple Music</span><span class="platform-chip audio">Audiomack</span><span class="platform-chip boom">Boomplay</span><span class="platform-chip shazam">Shazam</span><span class="platform-chip spotify">Spotify</span><span class="platform-chip youtube">YouTube</span></div></div><div class="span-4 info-block"><h3>Chart outputs</h3><p class="small">Singles, albums, artists, all-time lists, head-to-head tools, analytics, certifications and Hall of Fame entries all inherit the same scoring source.</p></div><div class="span-4 info-block"><h3>Brand note</h3><p class="small">“Ngoma” means music or drum in Swahili. The visual system keeps the local editorial tone while making the data easier to scan.</p></div></section></div>`}
function render(){let id=(location.hash||'#charts').replace('#',''); if(!pages.some(p=>p[0]===id)) id='charts'; nav(id); const map={charts,analytics,head,alltime,certs,about}; document.getElementById('app').innerHTML=map[id](); window.scrollTo({top:0,behavior:'instant'});}window.addEventListener('hashchange',render);render();
</script>
</body>
